# Shared base for every spec in this repository (oven-sh).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# Carried verbatim from the flat spec this repo grew out of. The fleet default
# is `date`; `none` is kept here so the port changes the coordinate and nothing
# else. Bun versions as bare semver (1.3.14) with no `+build` segment, so
# switching to `date` would be safe whenever the owner wants the fleet rule —
# it is a one-word change and costs one orphaned digest per already-published
# version.
build_timestamp: none

verify:
  github_asset_digest: true

concurrency:
  # Bun ships one ~100 MB binary per platform — an order of magnitude larger
  # than a typical single-binary CLI mirror, but still one file per bundle.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>. Bun's zip wraps a
# single `bun` executable in a `bun-<plat>/` directory, so `strip_components: 1`
# lands that executable AT the content root and PATH is a bare ${installPath}.
# `auto`/`verify` is rejected at spec load with exit 65 ("bin_scan is enabled
# but … declares no interface-visible ${installPath}/<dir> PATH entry"). `off`
# with a hand-listed `binaries` in metadata.json is the blessed shape for this
# archive layout.
bin_scan: off

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST, not how it was
# built. Bun is the split case: upstream ships a SEPARATE glibc and musl build
# per Linux arch and NEITHER is static — each names its own loader in
# PT_INTERP, so neither covers the other and BOTH Linux keys carry an explicit
# libc feature. The measurement is recorded above bun/mirror.yml's `assets:`.
#
# Container legs are the only mechanism that turns a libc claim into evidence:
#   - `+libc.glibc` → ubuntu + fedora, NO alpine. The glibc build cannot load
#     under musl, so an alpine leg would red on a correct artifact.
#   - `+libc.musl`  → a musl image only. Same reasoning mirrored.
#
# Both musl legs additionally need `containers[].setup` (ocx-mirror 0.5.1+).
# bun's musl build is dynamically linked and its DT_NEEDED names two libraries
# bare Alpine does not ship, so the leg cannot even load the artifact unstocked
# — measured on the real v1.3.14 bundle, 2026-08-02:
#
#   $ docker run --rm -v …:/pkg alpine:3.20 /pkg/bun --version
#   Error loading shared library libstdc++.so.6: No such file or directory (needed by /pkg/bun)
#   Error loading shared library libgcc_s.so.1: No such file or directory (needed by /pkg/bun)
#   … 50+ `Error relocating` lines; exit 127
#
#   $ docker run --rm -v …:/pkg alpine:3.20 \
#       sh -c 'apk add --no-cache libstdc++; /pkg/bun --version'
#   1.3.14                                                    # exit 0
#
# ONE `apk add` covers both gaps: the `libstdc++` package depends on `libgcc`,
# so both `Installing libgcc` and `Installing libstdc++` come from that line.
# It is also upstream's own documented Alpine prerequisite. Verified identically
# on arm64 (`bun-linux-aarch64-musl`, same two NEEDED entries, `1.3.14` under an
# emulated `--platform linux/arm64` alpine:3.20 with the same setup line).
#
# The claim these legs now make is the honest narrow one: bun's musl build runs
# on stock alpine:3.20 PLUS libstdc++. Keep it to that one line — a fatter image
# or a longer setup list would convert a real red into a false green.
platforms:
  "linux/amd64+libc.glibc":
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  "linux/amd64+libc.musl":
    runner: ubuntu-latest
    containers:
      - image: "alpine:3.20"
        shell: sh
        setup: &alpine-libstdcxx
          - apk add --no-cache libstdc++
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer's guard reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  "linux/arm64+libc.musl":
    runner: ubuntu-24.04-arm
    containers:
      - image: "alpine:3.20"
        shell: sh
        setup: *alpine-libstdcxx
  darwin/amd64:
    runner: macos-14
    prefix: ["arch", "-x86_64"]
    # darwin/amd64 is DECLARED but HELD broken across the entire version range.
    # bun-compiled binaries SIGILL (exit 132) under Rosetta 2 — a native-startup
    # illegal instruction, proven across mainline, the -baseline asset, AND
    # BUN_JSC_useJIT=0 (so it is NOT a JIT/AVX2 path disableable by asset/env).
    # GitHub retired native Intel macOS runners, so the Intel slice cannot be
    # CI-validated at all. Rather than silently drop it (as opencode did), an
    # open-ended `severity: broken` exclude keeps the platform VISIBLE as a 🔒
    # row — a deliberate, documented gap — and is reversible in one block-delete
    # if native Intel runners or a Rosetta-safe bun build ever return. The Intel
    # binary still runs fine on real Intel Macs; it just can't be tested here.
    exclude:
      - min_version: "0.0.0"   # whole range — every discovered version
        severity: broken
        reason: "bun SIGILLs under Rosetta 2; no native Intel macOS runner to CI-test"
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  #
  # No `windows/arm64`: upstream DOES publish `bun-windows-aarch64.zip`, but
  # this repository has never declared the platform and the port is not the
  # place to widen the published surface. Adding it is a `windows-11-arm`
  # runner plus one anchored asset regex, whenever the owner wants it.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
